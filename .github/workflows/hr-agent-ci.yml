name: HR Agent CI/CD

# The app lives in a subfolder of this course repo; only run when it (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "AI Engineering Techniques and Architectures Project/**"
      - ".github/workflows/hr-agent-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "AI Engineering Techniques and Architectures Project/**"
      - ".github/workflows/hr-agent-ci.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: "AI Engineering Techniques and Architectures Project"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_TODAY: "2026-10-01"
      LLM_API_KEY: ""
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.PROJECT_DIR }}/requirements.txt
            ${{ env.PROJECT_DIR }}/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build the RAG index
        run: python -m rag.ingest
      - name: Import check (app + MCP server)
        run: python -c "import app.main, mcp_server.server; print('imports ok')"
      - name: Unit, integration and MCP tests (tool discovery + real tool calls over stdio)
        run: python -m pytest -q
      - name: Evaluation gate (30 questions, thresholds enforced)
        run: python -m evaluation.run_eval --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ${{ env.PROJECT_DIR }}/evaluation/results/

  deploy:
    needs: test                       # deployment only runs if every test + the eval gate passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping deploy"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "DEPLOY_TRIGGERED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Wait for the NEW deployment to be healthy (free-tier Docker build can take several minutes)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set - skipping smoke test"; exit 0; fi
          # The old instance keeps answering /health while Render builds, so "status: ok" alone proves nothing.
          # Only accept a response from an instance that started after the hook fired: uptime_s < seconds since trigger.
          # Without a triggered deploy (no hook secret) fall back to a plain health check.
          started="${DEPLOY_TRIGGERED_AT:-0}"
          for i in $(seq 1 90); do
            body=$(curl -sS --max-time 60 "$APP_URL/health" || true)
            if echo "$body" | STARTED="$started" python3 -c '
          import json, os, sys, time
          try:
              h = json.load(sys.stdin)
          except ValueError:
              print("no JSON yet"); sys.exit(1)
          up = h.get("app", {}).get("uptime_s", 1e9)
          mcp = h.get("mcp", {})
          started = int(os.environ["STARTED"])
          fresh = started == 0 or up < time.time() - started
          ok = h.get("status") == "ok" and bool(mcp.get("connected"))
          print("health_ok=%s uptime_s=%s tools=%s new_instance=%s" % (ok, up, mcp.get("tool_count"), fresh))
          sys.exit(0 if ok and fresh else 1)
          '; then echo "new deployment is healthy"; exit 0; fi
            sleep 10
          done
          echo "new deployment did not become healthy within 15 minutes"; exit 1
