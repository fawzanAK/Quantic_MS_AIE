services:
  - type: web
    name: northwind-hr-agent
    runtime: python
    plan: free
    rootDir: "AI Engineering Techniques and Architectures Project"   # app lives in a subfolder of the course repo
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false          # GitHub Actions triggers the deploy hook only after tests pass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_TODAY
        value: "2026-10-01"
      - key: LLM_API_KEY        # optional (OpenRouter key, set in the Render dashboard); app works without it
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o
